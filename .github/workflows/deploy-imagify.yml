name: Deploy Imagify Docker Image

on:
  workflow_run:
    workflows:
      - Test Imagify
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_IMAGE: lexi-drift-imagify
  DOCKER_REGISTRY: registry.preciselab.space
  SERVER_IP: 188.245.164.95
  DIR: imagify.lexidrift.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to the private registry
      - name: Log in to private registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USER }}" ${{ env.DOCKER_REGISTRY }} --password-stdin

      # Build the Docker image
      - name: Build Docker Image
        working-directory: ./imagify
        run: docker build --platform linux/amd64 -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }} .

      # Push the Docker image
      - name: Push Docker Image
        run: docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}

      # Wyślij docker-compose.yml na serwer (.env zostaje na serwerze, nie jedzie przez CI)
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "imagify/docker-compose.yml"
          target: "/root/${{ env.DIR }}/"
          strip_components: 1

      # Deploy on server
      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /root/${{ env.DIR }}
            touch /root/${{ env.DIR }}/.env
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.DOCKER_REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}
            cd /root/${{ env.DIR }} && docker compose up -d --remove-orphans
            docker image prune -f
